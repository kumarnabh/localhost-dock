name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish single-file exe
        run: >
          dotnet publish src/LocalhostDock/LocalhostDock.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v5
        with:
          name: LocalhostDock-win-x64
          path: publish/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: LocalhostDock-win-x64
          path: LocalhostDock

      - name: Zip
        run: zip -r "LocalhostDock-${GITHUB_REF_NAME}-win-x64.zip" LocalhostDock

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "LocalhostDock-${GITHUB_REF_NAME}-win-x64.zip"
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
